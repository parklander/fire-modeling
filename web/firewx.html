<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Weather Forecast</title>
<link rel="stylesheet" href="/static/report.css?v=5">
<style>
  /* daily calendar: 7 weekday columns, one row per week */
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin: 14px 0 4px; }
  .cal-head { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding-bottom: 2px; }
  .cal-day { border-radius: 6px; padding: 6px 8px 7px; border: 1px solid var(--line); background: #fff; min-height: 86px; }
  .cal-day.empty { background: repeating-linear-gradient(135deg, #fafbfc 0 6px, #f3f5f7 6px 12px); }
  .cal-day.empty .dn { color: #b7bfc7; }
  .cal-day.past { opacity: .6; }
  .cal-day.today { outline: 2px solid var(--accent); outline-offset: -1px; }
  .cal-day .dn { font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
  .cal-day .r { font-weight: 700; font-size: 12.5px; margin: 3px 0 2px; }
  .cal-day .s { color: #4a535c; font-size: 11px; line-height: 1.4; }
  .tag-today, .tag-obs { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
  .tag-today { color: var(--accent); }
  .tag-obs { color: var(--muted); }
  @media (max-width: 600px) {
    .cal { gap: 3px; }
    .cal-day { padding: 4px 4px 5px; min-height: 70px; }
    .cal-day .s { font-size: 9.5px; }
    .cal-day .r { font-size: 10.5px; }
  }
  @media print { .cal-day { break-inside: avoid; } }
  .c0 { background: #dbe8fb; } .c1 { background: #dcf3e2; } .c1b { background: #c6ebd0; }
  .c2 { background: #fff3b8; } .c3 { background: #ffdcb0; } .c4 { background: #ffcfca; } .c5 { background: #f4a9a1; }
  td.c0, td.c1, td.c1b, td.c2, td.c3, td.c4, td.c5 { font-weight: 600; }
  td small { font-weight: 400; }
  .fuel { font-weight: 600; font-size: 11px; }
  .fbp-opt.off { opacity: .4; }
  table.fx th, table.fx td { padding: 4px 6px; font-size: 12px; }
  table.fx th.past, table.fx td.past { color: #8a939c; }
  table.fx th.today { border-bottom: 2px solid var(--accent); }
  tr.sect td { background: var(--soft); font-weight: 600; color: var(--muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: .4px; }
  .chart-box { position: relative; height: 230px; margin-top: 8px; }
  .controls a.btn { color: #e8ecf1; text-decoration: none; border: 1px solid rgba(255,255,255,.2); padding: 5px 10px; border-radius: 6px; }
</style>
</head>
<body>
<form class="controls no-print" id="controls">
  <div class="row">
    <label>Area <select name="aoi"><option value="">Custom point</option></select></label>
    <label>Location name <input name="name" placeholder="e.g. CFB Shilo RTA"></label>
    <label>Lat <input name="lat" size="8"></label>
    <label>Lon <input name="lon" size="8"></label>
    <label>Danger scale <select name="scale"><option value="mb">Manitoba (FWI)</option><option value="cwfis">CWFIS rating</option></select></label>
    <label style="flex-direction:row;align-items:center;gap:6px"><input name="fbp" type="checkbox"> Fire behaviour</label>
    <label class="fbp-opt">Fuel radius <input name="radius_km" type="number" min="1" max="30" step="1" value="10" style="width:56px"> km</label>
    <label class="fbp-opt">Curing <input name="curing" type="number" min="0" max="100" step="5" placeholder="seasonal" style="width:80px"> %</label>
    <span class="spacer"></span>
    <button type="submit">Update</button>
    <button type="button" id="csv">Download CSV</button>
    <button type="button" id="print">Print / PDF</button>
    <a class="btn" href="/">Weather map ↗</a>
  </div>
</form>

<main id="doc" class="doc"><p class="loading">Building forecast… (CWFIS grids take a few seconds)</p></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="/static/firewx.js?v=5"></script>
</body>
</html>
