<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National Fire Weather Summary</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/static/report.css?v=10">
<style>
  .c0 { background: #dbe8fb; } .c1 { background: #dcf3e2; } .c2 { background: #fff3b8; }
  .c3 { background: #ffdcb0; } .c4 { background: #ffcfca; } .cna { background: #f1f3f5; color: #9aa3ad; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .card .v { font-size: 20px; font-weight: 700; }
  .card .k { color: var(--muted); font-size: 11.5px; }
  .card.concern .v { color: var(--bad); } .card.watch .v { color: var(--warn); } .card.normal .v { color: var(--ok); }
  #map { height: 340px; border-radius: 6px; border: 1px solid var(--line); margin: 6px 0 4px; }
  .pin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .pin.Normal { background: #1f7a43; } .pin.Watch { background: #e0a000; } .pin.Concern { background: #d7263d; }
  .leaflet-tooltip.pinlabel { background: rgba(255,255,255,.92); border: 0; box-shadow: none; padding: 0 4px; font: 600 10.5px/1.4 inherit; color: #16191d; }
  .leaflet-tooltip.pinlabel::before { display: none; }
  .status { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .status.Normal { background: var(--ok-bg); color: var(--ok); }
  .status.Watch { background: var(--warn-bg); color: var(--warn); }
  .status.Concern { background: var(--bad-bg); color: var(--bad); }
  table.mx th, table.mx td { padding: 4px 5px; font-size: 12px; text-align: center; }
  table.mx td:first-child, table.mx th:first-child { text-align: left; white-space: nowrap; }
  table.mx td.day { font-weight: 600; min-width: 62px; }
  table.mx td.day small { white-space: nowrap; }
  table.mx td.day small { display: block; font-weight: 400; font-size: 9.5px; color: #4a535c; }
  table.mx td.day .fl { color: var(--bad); font-weight: 700; }
  table.mx tr.prov td { background: var(--soft); color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; text-align: left; }
  ul.findings li { margin: 4px 0; }
  .legend-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .legend-row i { display: inline-block; width: 22px; height: 12px; border-radius: 2px; border: 1px solid var(--line); vertical-align: -2px; }
  @media (max-width: 760px) { .cards { grid-template-columns: 1fr 1fr; } }
  @media print { #map { height: 300px; } }
</style>
</head>
<body>
<form class="controls no-print" id="controls">
  <div class="row">
    <label>Prepared for <input name="for" value="Canadian Forces Fire Marshal (CFFM)" size="34"></label>
    <label>Prepared by <input name="by" placeholder="Name / unit" size="22"></label>
    <span class="spacer"></span>
    <button type="button" id="refresh">Refresh</button>
    <button type="button" id="csv">Download CSV</button>
    <button type="button" id="print">Print / PDF</button>
    <a href="/" style="color:#e8ecf1">Weather map ↗</a>
  </div>
</form>

<main id="doc" class="doc"><p class="loading">Building the national summary… (CWFIS grids for every base; about 15 s the first time)</p></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/frontwatch.js?v=1"></script>
<script src="/static/national.js?v=5"></script>
</body>
</html>
